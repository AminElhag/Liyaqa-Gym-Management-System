# Nginx Configuration for Custom Domain Support
# This configuration handles both subdomain routing (tenant1.liyaqa.com) and custom domains (gym.example.com)

# Map to extract tenant slug from subdomain
map $host $tenant_slug {
    default "";

    # Subdomain routing: tenant1.liyaqa.com -> "tenant1"
    ~^(?<slug>[^.]+)\.liyaqa\.com$ $slug;

    # Custom domains will be passed as-is to the backend for database lookup
    ~^(?<domain>.+)$ $domain;
}

# Upstream backend application
upstream backend {
    server backend:8080;
    # Add more backend servers for load balancing if needed
    # server backend2:8080;
    # server backend3:8080;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name *.liyaqa.com liyaqa.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server for liyaqa.com subdomains
server {
    listen 443 ssl http2;
    server_name *.liyaqa.com liyaqa.com;

    # SSL certificate for liyaqa.com wildcard
    ssl_certificate /etc/letsencrypt/live/liyaqa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liyaqa.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass http://backend;
        access_log off;
    }
}

# HTTPS server for custom domains
# This uses Lua and OpenResty for dynamic SSL certificate loading
server {
    listen 443 ssl http2;
    server_name ~^(?!.*\.liyaqa\.com$).*$;  # Match any domain not ending with .liyaqa.com

    # Dynamic SSL certificate loading using lua-resty-auto-ssl
    ssl_certificate_by_lua_block {
        auto_ssl:ssl_certificate()
    }

    # Fallback certificate (required by Nginx)
    ssl_certificate /etc/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy settings
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Custom-Domain $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass http://backend;
        access_log off;
    }
}

# Server block for Let's Encrypt ACME challenge (HTTP-01)
server {
    listen 80;
    server_name ~^(?!.*\.liyaqa\.com$).*$;  # Match any custom domain

    # ACME challenge location for Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            auto_ssl:challenge_server()
        }
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
